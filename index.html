<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zijian | Learning Space</title>

  <!-- Docsify 基础主题 + KaTeX 样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

  <style>
    :root {
      --theme-color: #111827; /* 克制的深墨黑色作为主题强调色 */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1f2937;
      background-color: #ffffff;
    }

    /* 侧边栏极简风格优化 */
    .sidebar {
      border-right: 1px solid #e5e7eb;
      background-color: #fafafa;
    }
    .sidebar .app-name-link {
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #111827;
    }
    .sidebar ul li a {
      color: #4b5563;
      font-size: 14px;
    }
    .sidebar ul li.active > a {
      color: #111827;
      font-weight: 600;
      border-right: 2px solid #111827;
    }

    /* 正文排版与阅读宽度 */
    .markdown-section {
      max-width: 800px;
      padding: 36px 28px 80px;
      line-height: 1.8;
    }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      color: #111827;
      font-weight: 600;
    }
    .markdown-section h2 {
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 6px;
      margin-top: 2.2em;
    }
    .markdown-section a {
      color: #111827;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: #9ca3af;
    }
    .markdown-section a:hover {
      text-decoration-color: #111827;
    }

    /* 代码块与行内代码优化 */
    .markdown-section pre {
      border-radius: 6px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    .markdown-section pre > code {
      background-color: transparent;
      font-size: 0.9rem;
    }
    .markdown-section code {
      background-color: #f3f4f6;
      color: #111827;
      border-radius: 4px;
    }

    /* 独立数学公式溢出时允许横向滚动，适配手机端 */
    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 0;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>

  <!-- 1. 先加载 KaTeX，确保解析 Markdown 时可直接调用 -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <!-- 2. Docsify 核心配置 -->
  <script>
    window.$docsify = {
      name: 'Zijian.Notes',
      repo: 'https://github.com/CyruZdesu/cyruzdesu.github.io',
      loadSidebar: true,          // 启用左侧 _sidebar.md
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 3,             // 自动在侧边栏生成当前文章的 2~3 级标题大纲
      auto2top: true,             // 切换文章后自动回到顶部
      search: {
        paths: 'auto',
        placeholder: '搜索笔记、公式或代码...',
        noData: '未找到匹配内容',
        depth: 4
      },
      copyCode: {
        buttonText: '复制代码',
        errorText: '复制失败',
        successText: '已复制'
      },
      // 自定义防冲突 KaTeX 插件：跳过代码块，先编译公式再交给 Markdown 渲染
      plugins: [
        function (hook) {
          let mathBlocks = [];
          hook.beforeEach(function (content) {
            mathBlocks = [];
            if (typeof katex === 'undefined') return content;
            return content.replace(
              /(```[\s\S]*?```|`[^`\n]+`|\\\$)|\$\$([\s\S]+?)\$\$|\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g,
              function (match, ignored, displayMath, inlineMath) {
                if (ignored) return match;
                const tex = (displayMath || inlineMath).trim();
                const isDisplay = Boolean(displayMath);
                try {
                  const html = katex.renderToString(tex, {
                    displayMode: isDisplay,
                    throwOnError: false
                  });
                  const idx = mathBlocks.push(html) - 1;
                  return `KATEXPLACEHOLDER${idx}END`;
                } catch (e) {
                  return match;
                }
              }
            );
          });
          hook.afterEach(function (html) {
            return html.replace(/KATEXPLACEHOLDER(\d+)END/g, function (_, idx) {
              return mathBlocks[Number(idx)] || '';
            });
          });
        }
      ]
    };
  </script>

  <!-- 3. Docsify 核心与插件 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>

  <!-- 4. Prism 编程语言高亮扩展（按需增减） -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
